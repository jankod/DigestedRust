name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    name: cargo check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check
      - run: cargo check --features python
      - run: cargo test --lib
